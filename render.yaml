services:
  - type: web
    name: ecopulse
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /
    disk:
      name: ecopulse-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PRODUCTION
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      # Vercel rewrite (1) + Render (1) đứng trước app
      - key: TRUSTED_PROXIES
        value: "2"
      - key: HN_DB
        value: /data/hydronisar.db
      - key: CACHE_DIR
        value: /data/cache
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: EARTHDATA_TOKEN
        sync: false
      - key: NEXT_PUBLIC_MAPTILER_KEY
        sync: false
      - key: HN_ADMIN_PHONE
        sync: false
      - key: HN_ADMIN_PASSWORD
        sync: false
      - key: GEOCODE_USER_AGENT
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
