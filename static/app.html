const LIM=()=>!!(me&&me.limited);   // phiên "Quên mật khẩu": chỉ xem Thửa của tôi
const api=async(p,m="GET",b)=>{const r=await fetch(p,{method:m,headers:b?{"Content-Type":"application/json"}:{},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));if(r.status===401&&me&&!p.startsWith("/auth/")){location.reload();return new Promise(()=>{})}
  if(!r.ok)throw new Error(typeof j.detail==="string"?j.detail:j.detail?"Thông tin nhập chưa hợp lệ":"Lỗi "+r.status);return j};
const when=t=>{if(!t)return"";const d=new Date(/Z$|[+-]\d\d:?\d\d$/.test(t)?t:t.replace(" ","T")+"Z");return isNaN(d)?t:d.toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit",year:"numeric"})};
const ago=m=>m==null?"":m<1?"vừa xong":m<60?m+" phút":m<1440?Math.floor(m/60)+" giờ":Math.floor(m/1440)+" ngày";
const age=t=>{const d=Math.max(0,Math.floor((Date.now()-new Date(t))/864e5));return d+" ngày trước"};

/* ---------- đăng nhập / đăng ký ---------- */
const eye=id=>`<div class="pw"><input id="${id}" type="password" autocomplete="${id==="pw"&&am==="login"?"current-password":"new-password"}" placeholder="Mật khẩu (từ 8 ký tự)"><button type="button" class="eye" data-eye="${id}" title="Hiện mật khẩu">👁</button></div>`;
const where=p=>`<div class="row"><input id="${p}p" list="provs" placeholder="Tỉnh / thành phố" autocomplete="off"><input id="${p}w" placeholder="Xã / phường" autocomplete="off"></div><button type="button" class="s g" data-gps="${p}">📍 Dùng vị trí hiện tại</button> <span class="mute" id="${p}m">Chỉ lấy tỉnh và xã/phường, không lưu tọa độ.</span>`;
function geoFill(p){const m=$(p+"m");if(!navigator.geolocation){m.textContent="Thiết bị không hỗ trợ lấy vị trí. Hãy nhập tay.";return}
  m.textContent="Đang lấy vị trí…";
  navigator.geolocation.getCurrentPosition(async pos=>{try{const r=await api(`/geo/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
    $(p+"p").value=r.province;$(p+"w").value=r.ward;m.textContent=r.ward?"Đã điền theo vị trí hiện tại. Bạn kiểm tra lại nếu cần.":"Chưa xác định được xã/phường, hãy nhập tay."}catch(e){m.textContent=e.message}},
    ()=>{m.textContent="Không lấy được vị trí. Hãy nhập tay."},{timeout:10000})}
function drawAuth(){const L=am==="login"||am==="forgot";$("t1").classList.toggle("on",L);$("t2").classList.toggle("on",!L);let h="";
  const who=`<div class="tabs sub"><button type="button" class="${am==="reg"?"on":""}" data-am="reg">Nông dân</button><button type="button" class="${am==="regA"?"on":""}" data-am="regA">Quản lý xã/phường</button></div>`;
  if(am==="login")h=`<div class="row"><input id="id" placeholder="Tên (nông dân) hoặc email (quản lý)" autocomplete="username">${eye("pw")}</div><div class="err" id="aerr"></div><button class="g" id="go" style="width:100%">Đăng nhập</button><p><a href="#" class="lk" data-am="forgot">Quên mật khẩu?</a></p>`;
  else if(am==="forgot")h=`<b>Quên mật khẩu</b><p class="mute">Chỉ dành cho nông dân: nhập tên đã đăng ký để <b>xem thửa của bạn</b> (chế độ chỉ xem). Muốn thêm/sửa thửa, nhắn tin, đọc kiến thức hoặc hỏi Bác Nông thì cần nhập mật khẩu.</p><div class="row"><input id="fn" placeholder="Họ và tên đã đăng ký"></div><div class="err" id="aerr"></div><button class="g" id="go" style="width:100%">Xem thửa của tôi</button><p><a href="#" class="lk" data-am="login">← Quay lại đăng nhập</a></p>`;
  else if(am==="reg")h=who+`<div class="row"><input id="rn" placeholder="Họ và tên" autocomplete="name"><div class="err" id="nh"></div>${eye("pw")}</div>${where("r")}<div class="err" id="aerr"></div><button class="g" id="go" style="width:100%">Tạo tài khoản</button><p class="mute">Tên đăng nhập là họ tên của bạn nên không được trùng với người khác.</p>`;
  else if(am==="regA")h=who+`<div class="row"><input id="an" placeholder="Họ và tên" autocomplete="name"><input id="aph" placeholder="Số điện thoại" inputmode="tel" autocomplete="tel"><input id="aem" placeholder="Email" type="email" autocomplete="email">${eye("pw")}</div>${where("a")}<div class="err" id="aerr"></div><button class="g" id="go" style="width:100%">Gửi mã OTP về email</button><p class="mute">Mã xác nhận sẽ được gửi về email bạn nhập.</p>`;
  else if(am==="otp")h=`<b>Nhập mã xác nhận</b><p class="mute">Mã gồm 6 số đã được gửi tới <b>${esc(pend.email)}</b>.${pend.emailed?"":" Máy chủ chưa cấu hình gửi email, mã đang được in ở cửa sổ chạy server (chế độ thử nghiệm)."}</p><div class="row"><input id="oc" placeholder="Mã OTP" inputmode="numeric" maxlength="8" autocomplete="one-time-code"></div><div class="err" id="aerr"></div><button class="g" id="go" style="width:100%">Xác nhận</button><p><a href="#" class="lk" id="resend">Gửi lại mã</a> · <a href="#" class="lk" data-am="regA">Sửa thông tin</a></p>`;
  $("box").innerHTML=h;bindAuth()}
function bindAuth(){const b=$("box");
  b.querySelectorAll("[data-am]").forEach(x=>x.onclick=e=>{e.preventDefault();am=x.dataset.am;drawAuth()});
  b.querySelectorAll("[data-eye]").forEach(x=>x.onclick=()=>{const i=$(x.dataset.eye),s=i.type==="password";i.type=s?"text":"password";x.textContent=s?"🙈":"👁";x.title=s?"Ẩn mật khẩu":"Hiện mật khẩu"});
  b.querySelectorAll("[data-gps]").forEach(x=>x.onclick=()=>geoFill(x.dataset.gps));
  b.querySelectorAll("input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter"&&$("go"))$("go").click()});
  if($("rn"))$("rn").onblur=async()=>{const v=$("rn").value.trim();$("nh").textContent="";if(v.length<2)return;try{const r=await api("/auth/name-free?name="+encodeURIComponent(v));if(!r.free)$("nh").textContent="Tên này đã có người dùng. Hãy thêm số hoặc tên thôn/ấp để phân biệt."}catch{}};
  if($("resend"))$("resend").onclick=async e=>{e.preventDefault();try{const r=await api("/auth/admin/start","POST",pend.body);pend.emailed=r.emailed;$("aerr").textContent="Đã gửi lại mã."}catch(x){$("aerr").textContent=x.message}};
  if($("go"))$("go").onclick=submitAuth}
async function submitAuth(){const bt=$("go"),er=$("aerr");er.textContent="";bt.disabled=true;
  try{if(am==="login")await api("/auth/login","POST",{ident:$("id").value,password:$("pw").value});
    else if(am==="forgot")await api("/auth/forgot","POST",{name:$("fn").value});
    else if(am==="reg")await api("/auth/register","POST",{full_name:$("rn").value,password:$("pw").value,province:$("rp").value,ward:$("rw").value});
    else if(am==="regA"){const body={full_name:$("an").value,phone:$("aph").value.trim(),email:$("aem").value.trim(),province:$("ap").value,ward:$("aw").value,password:$("pw").value};
      const r=await api("/auth/admin/start","POST",body);pend={email:body.email,body,emailed:r.emailed};am="otp";drawAuth();return}
    else if(am==="otp"){const r=await api("/auth/admin/verify","POST",{email:pend.email,code:$("oc").value});
      if(r.pending){$("box").innerHTML='<b>Đã gửi đăng ký</b><p class="mute">Email của bạn đã được xác nhận. Tài khoản đang chờ quản lý tỉnh duyệt. Sau khi được duyệt, bạn đăng nhập bằng email và mật khẩu đã đăng ký.</p><button class="g" type="button" data-am="login" style="width:100%">Về trang đăng nhập</button>';bindAuth();return}}
    await boot()}catch(e){er.textContent=e.message;bt.disabled=false}}
$("t1").onclick=()=>{am="login";drawAuth()};$("t2").onclick=()=>{am="reg";drawAuth()};
api("/geo/provinces").then(L=>$("provs").innerHTML=L.map(x=>`<option value="${esc(x)}">`).join("")).catch(()=>{});

function limBar(){const b=$("lim");if(!me.limited){b.classList.add("hide");return}
  b.classList.remove("hide");
  b.innerHTML='<b>Bạn đang ở chế độ chỉ xem</b><p class="mute">Bạn vào bằng "Quên mật khẩu" nên chỉ xem được thửa của mình. Nhập mật khẩu để dùng đầy đủ: thêm/sửa thửa, nhắn tin, kiến thức, Bác Nông.</p><div class="rs"><input id="limpw" type="password" placeholder="Mật khẩu" autocomplete="current-password"><button class="g s" id="limgo">Mở đầy đủ</button></div><div class="err" id="limerr"></div>';
  const go=async()=>{$("limerr").textContent="";try{await api("/auth/upgrade","POST",{password:$("limpw").value});location.reload()}catch(e){$("limerr").textContent=e.message}};
  $("limgo").onclick=go;$("limpw").onkeydown=e=>{if(e.key==="Enter")go()}}
function badges(){document.querySelectorAll("#nav [data-b]").forEach(s=>{const n=s.dataset.b==="inbox"?me.unread:s.dataset.b==="know"?me.news_pending:s.dataset.b==="users"?me.pending_admins:me.unread_chat;s.textContent=n||"";s.classList.toggle("hide",!n)})}
async function boot(){try{me=await api("/me")}catch{return}
  $("auth").classList.add("hide");$("view").classList.remove("hide");$("nav").classList.remove("hide");$("out").classList.remove("hide");
  $("who").textContent=`${me.name} · ${me.role_vi}`;
  $("nav").innerHTML=(me.limited?LIMNAV:NAV[me.role]).map(([k,l])=>`<button data-k="${k}">${l}${k==="inbox"||k==="chat"||(k==="know"&&me.role==="admin_province")||(k==="users"&&me.role==="admin_province")?`<span class="dot hide" data-b="${k}"></span>`:""}</button>`).join("");badges();
  $("nav").onclick=e=>{const k=e.target.closest("button")?.dataset.k;if(!k)return;if(k==="plots")plotSel=null;if(k==="chat")chatPeer=null;if(k==="know"){kArt=null;kTopic=null;kPv=null;kF=null;kAi=null;kMode=me.role==="farmer"?"lib":"mng"}show(k)};limBar();show(me.limited?"plots":"home")}
setInterval(async()=>{if(me&&!document.hidden){try{me=await api("/me");badges()}catch{}}},45000);
const stopPoll=()=>{clearInterval(poll);poll=null};
async function show(k){tab=k;stopPoll();[...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.k===k));const v=$("view"),pane=v.parentElement;
  v.classList.toggle("full",k==="map");v.classList.remove("chat-layout","wide","wide2");pane.classList.remove("chat-pane");
  if(k==="map"){v.innerHTML='<iframe src="/map" title="Bản đồ độ ẩm đất"></iframe>';return}
  v.innerHTML='<p class="mute">Đang tải…</p>';try{v.innerHTML=await V[k]();if(k==="chat"&&chatPeer){v.classList.add("chat-layout");pane.classList.add("chat-pane")}bind(k)}catch(e){v.innerHTML=`<p class="err">${esc(e.message)}</p>`}}
const re=async()=>{me=await api("/me");badges();return show(tab)};

const contactCard=p=>`<button class="contact" data-peer="${p.id}"><span class="${p.online?"on-dot":"off-dot"}"></span><span class="ct"><b>${esc(p.name)}${p.phone?" - "+esc(p.phone):""}</b><span class="mute">${esc(p.role_vi)}${p.place?" · "+esc(p.place):""}</span><span class="mute">${statusTxt(p)}</span>${p.last?`<span class="last">${esc(p.last)}</span>`:""}</span>${p.unread?`<span class="dot">${p.unread}</span>`:""}</button>`;

async function threadView(r){

  const p=r.peer,cur=st.get("hn_chatbg")||"0";
  let plots=[],selected=null;
  try{
    plots=await api("/plots");

      const chosen=plots.find(x=>String(x.id)===String(chatFarmPlot))||plots[0];

}
let audio=null;
const viVoice=()=>new Promise(res=>{if(!("speechSynthesis" in window))return res(null);
  const f=()=>speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().replace("_","-").startsWith("vi"))||null;
  if(f()||speechSynthesis.getVoices().length)return res(f());
  const t=setTimeout(()=>res(f()),1200);speechSynthesis.onvoiceschanged=()=>{clearTimeout(t);res(f())}});
async function speak(t,btn){if(audio){audio.pause();audio=null}if("speechSynthesis" in window)speechSynthesis.cancel();
  const old=btn&&btn.textContent;if(btn)btn.textContent="⏳";
  try{const v=await viVoice();   /* ưu tiên giọng tiếng Việt có sẵn trên máy; không có thì dùng giọng từ máy chủ */

function hChart(H,k){const P=!H?[]:k==="s"?H.soil.map(x=>({l:new Date(x.t).toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit"}),v:Math.round(x.v*1000)/10})):H.days.map(d=>({l:WD[new Date(d.date+"T00:00:00").getDay()],v:k==="t"?d.tmean:d.rain})),u={t:"°C",r:" mm",s:"%"}[k];
  if(P.length<(k==="s"?2:1)||P.some(x=>x.v==null))return `<p class="mute">${k==="s"?"Chưa đủ ảnh vệ tinh đã xử lý để vẽ lịch sử độ ẩm đất.":"Chưa lấy được dữ liệu lịch sử lúc này."}</p>`;
  const vs=P.map(x=>x.v),mx=Math.max(...vs),mn=Math.min(...vs),lo=k==="t"?Math.floor(mn)-1:0,hi=Math.max(k==="t"?Math.ceil(mx)+1:Math.ceil(mx),lo+1),W=600,Hh=200,L=44,B=24,T=12,bw=(W-L-10)/P.length,X=i=>L+(i+.5)*bw,Y=v=>T+(hi-v)*(Hh-T-B)/(hi-lo);
  let g="";for(let n=0;n<=4;n++){const v=lo+(hi-lo)*n/4;g+=`<line class="ln" x1="${L}" x2="${W-6}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*10)/10}${u}</text>`}
  const m=k==="r"?P.map((x,i)=>`<rect x="${X(i)-bw*.3}" y="${Y(x.v)}" width="${bw*.6}" height="${Math.max(1,Y(lo)-Y(x.v))}" rx="3" fill="var(--b)"/>`).join(""):`<polyline fill="none" stroke="var(--b)" stroke-width="2.5" points="${P.map((x,i)=>X(i)+","+Y(x.v)).join(" ")}"/>`+P.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="4" fill="var(--b)"/>`).join("");
  return `<div class="hc"><svg viewBox="0 0 ${W} ${Hh}" role="img">${g}${m}${P.map((x,i)=>`<text x="${X(i)}" y="${Y(x.v)-8}" text-anchor="middle" style="fill:var(--ink)">${Math.round(x.v*10)/10}</text><text x="${X(i)}" y="${Hh-6}" text-anchor="middle">${x.l}</text>`).join("")}</svg></div>`}
async function plotDetail(id){const[p,H]=await Promise.all([api("/plots/"+id),api("/plots/"+id+"/history").catch(()=>null)]);HIS=H;const s=p.status,w=p.weather,
  ph=p.photo?`<div class="plph">${phImg(p.photo,"plimg")}</div>${LIM()?"":`<div class="rs"><button class="s" data-up="${p.id}">Đổi ảnh</button><button class="s r" data-ph="del">Xóa ảnh</button></div>`}`:plus(p.id),

  m+=`<h3>Khuyến nghị canh tác</h3>`+(s?`<div class="card"><p><span class="chip" style="background:${s.color}"></span><b>${esc(s.name)}</b> · ${Math.round(s.value*100)}% · ${esc(s.act)}</p><p>${esc(s.state)}</p><b>Giải pháp</b><ul>${s.do.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${near(s)}<p class="mute">Ảnh vệ tinh ${age(s.scene_time)}. Mưa hoặc tưới sau đó chưa được tính; vệ tinh chỉ đo lớp đất mặt, ô ảnh khoảng 200 m. Dữ liệu NISAR còn đang hiệu chuẩn.</p></div>`:`<div class="card"><p class="mute">Chưa có ảnh vệ tinh phủ vị trí này.</p></div>`);
  m+=w?`<div class="card"><b>Nhiệt độ</b><p>Hiện tại <b>${Math.round(w.now)}°C</b> · độ ẩm không khí ${w.rh}% · 3 ngày tới từ <b>${Math.round(w.temp.range[0])}°C</b> đến <b>${Math.round(w.temp.range[1])}°C</b></p><b>Giải pháp</b>${adv(w.temp)}</div><div class="card"><b>Lượng mưa sắp tới</b><p>Tổng 3 ngày: <b>${w.rain.total} mm</b></p><b>Giải pháp</b>${adv(w.rain)}<p class="mute">Gợi ý chung theo dự báo, hãy đối chiếu với tình hình thực tế tại ruộng.</p></div>`:"";
  const side=`<h3 style="margin-top:0">Thông tin thửa đất</h3><div class="card"><div class="kv"><span class="mute">Loại cây</span><b>${esc(p.crop||"Chưa ghi")}</b></div><div class="kv"><span class="mute">Kinh độ</span><b>${p.lon.toFixed(5)}</b></div><div class="kv"><span class="mute">Vĩ độ</span><b>${p.lat.toFixed(5)}</b></div></div><h3>Ảnh thửa đất</h3><div class="card">${ph}${LIM()?"":'<p><a class="lk" href="#" data-go="map">Xem trên bản đồ →</a></p>'}</div><input type="file" id="pfile" accept="image/*" hidden>`;
  return `<div class="card pl"><div class="hd"><button class="s" id="back">← Các thửa</button>${LIM()?"":'<button class="s r" id="pdel">Xóa thửa</button>'}</div><h2>${esc(p.name)}</h2><p><span class="plb">${esc(p.crop||"Chưa ghi")}</span> <span class="mute">${place(p)}</span></p><div class="pl3"><div>${m}</div><div class="pls">${side}</div></div></div>${LIM()?"":'<div class="rs"><button class="g" id="ask">Hỏi hợp tác xã</button></div>'}`}

{id:"tn",topic:"Hạn hán",tag:"Nông nghiệp",min:8,img:1,title:"Độ ẩm đất và bài toán quản lý nguồn nước tại Tây Nguyên",lead:"Tìm hiểu vai trò của độ ẩm đất đối với sinh trưởng cây trồng, khả năng giữ nước và quản lý tưới tiêu.",s:[

["Tưới đúng lúc, đúng lượng",["Thay vì tưới theo lịch cố định, hãy tưới khi độ ẩm xuống thấp và dừng khi đất đã đủ ẩm. Cách này tiết kiệm nước, điện và hạn chế rửa trôi phân bón.","Tưới thấm sâu vùng rễ, vào sáng sớm hoặc chiều mát, hiệu quả hơn tưới ít nước nhiều lần."]],
["Dùng bản đồ vệ tinh để theo dõi",["Ứng dụng này hiển thị độ ẩm đất mặt do vệ tinh ước tính. Đây là số liệu tham khảo, hãy đối chiếu với tình trạng thực tế ngoài ruộng trước khi quyết định."]]]},
{id:"am",topic:"Hạn hán",tag:"Kiến thức",min:6,img:8,dg:1,title:"Đọc độ ẩm đất: 5 mức và việc cần làm",lead:"Độ ẩm đất mặt do vệ tinh ước tính, tính theo m³/m³. Sai số còn lớn nên hãy kiểm tra thêm tại ruộng.",s:[

["Năm mức độ ẩm","LV"],
["Ba mốc cần nhớ",["Bão hòa là khi mọi khe đất đều đầy nước. Sức chứa đồng ruộng là lượng nước đất giữ lại sau khi nước thừa đã thoát đi. Điểm héo là mức đất còn nước nhưng cây không hút nổi nữa."],[10,1]]]},
{id:"ni",topic:"Viễn thám",tag:"Khoa học · Viễn thám",min:5,img:2,title:"NISAR: Công nghệ radar mới trong giám sát Trái Đất",lead:"NISAR là vệ tinh radar do NASA và ISRO (Ấn Độ) hợp tác, quan sát mặt đất cả ngày lẫn đêm, trời nắng hay nhiều mây.",s:[
["NISAR là gì",["NISAR (NASA-ISRO Synthetic Aperture Radar) mang hai radar khẩu độ tổng hợp băng L và băng S, cùng ăng-ten phản xạ đường kính khoảng 12 m. Vệ tinh được phóng năm 2025.","Radar chủ động phát sóng rồi thu tín hiệu phản hồi nên vẫn quan sát được khi có mây hoặc ban đêm, rất hợp với vùng nhiệt đới nhiều mây như Việt Nam."]],
["Quan sát để làm gì",["Dữ liệu NISAR phục vụ nhiều việc: độ ẩm đất, sinh khối rừng, biến dạng mặt đất, băng, đất ngập nước và theo dõi mùa vụ.","Vệ tinh lặp lại quan sát trên cùng một khu vực khoảng 12 ngày một lần, và dữ liệu được công bố mở."]],
["Từ radar đến bản đồ độ ẩm",["Độ ẩm đất làm thay đổi cách đất phản xạ sóng radar. Từ tín hiệu đó, thuật toán ước tính độ ẩm lớp đất mặt cho từng ô lưới trên bản đồ.","Cây cối, địa hình và độ nhám bề mặt cũng ảnh hưởng đến tín hiệu nên kết quả vẫn có sai số, nhất là ở vườn cây rậm."],[11,1]]]},
{id:"sr",topic:"Biến đổi khí hậu",tag:"Cây trồng",min:5,img:4,title:"Thời tiết và độ ẩm đất ảnh hưởng thế nào đến sầu riêng?",lead:"Sầu riêng cần nước nhưng rất sợ úng, nên theo dõi độ ẩm đất là việc phải làm quanh năm.",s:[

["Khô ẩm thất thường làm rụng và nứt trái",["Khi nuôi trái, độ ẩm đất dao động mạnh có thể làm rụng trái non. Đất khô lâu rồi gặp mưa to hoặc tưới ồ ạt dễ làm nứt trái.","Hãy giữ ẩm đều và tăng lượng tưới từ từ."]],
["Mùa khô và ra hoa",["Nhiều vườn cho cây hơi thiếu nước một thời gian ngắn trước khi xử lý ra hoa. Thời gian cụ thể tùy vùng, giống và tuổi cây, bạn nên theo hướng dẫn kỹ thuật của địa phương.","Khi bản đồ báo mức Rất khô, hãy ưu tiên tưới cho vườn đang ra hoa, đậu trái."]]]},

["Nắng nóng",["Nhiệt độ quá cao làm cây bị stress, hoa dễ rụng và trái phát triển kém. Cây che bóng và trồng xen giúp hạ nhiệt cho vườn."]],
["Mưa trái mùa và úng",["Mưa lớn lúc cây đang ra hoa làm trôi hoa, giảm đậu trái. Mưa kéo dài cũng làm đất úng và tạo điều kiện cho nấm bệnh phát triển.","Khi bản đồ báo Ẩm ướt hoặc Quá ẩm, hãy tắt tưới và kiểm tra rãnh thoát nước."]]]},
{id:"cs",topic:"Biến đổi khí hậu",tag:"Cây trồng",min:5,img:5,title:"Cây cao su: mưa, nắng và độ ẩm đất",lead:"Cao su là cây dài ngày, nhưng thời tiết vẫn tác động rõ đến mủ, lá và bệnh hại.",s:[
