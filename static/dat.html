<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thích nghi đất đai</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--bg:#fff;--ink:#1d2b24;--mute:#62736a;--line:#dfe6e1;--g:#2e7d4f;--gl:#e8f3ec;--warn:#b26a00;--warnbg:#fff4e0;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#131c18;--ink:#e6efe9;--mute:#9db0a6;--line:#27342d;--g:#5fb883;--gl:#1d2a23;--warn:#f0b35a;--warnbg:#33290f;--bad:#ff8a80}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;font:13px/1.5 system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
#side{width:370px;max-width:46vw;overflow:auto;border-right:1px solid var(--line);padding:14px}#map{flex:1;min-width:0}
h1{font-size:16px;margin:0 0 2px}h2{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--g);margin:16px 0 6px}p{margin:4px 0}.mute{color:var(--mute)}
select,button{font:inherit;color:inherit}select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
button{border:1px solid var(--line);background:var(--gl);border-radius:8px;padding:5px 10px;cursor:pointer}button.g{background:var(--g);border-color:var(--g);color:#fff;font-weight:600;padding:9px 12px;width:100%}button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.crit{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}.crit.off{opacity:.65}
.crit label{display:flex;gap:8px;align-items:flex-start;font-weight:600;cursor:pointer}.crit label input{margin-top:3px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--gl);color:var(--mute);font-weight:400}.tag.w{background:var(--warnbg);color:var(--warn)}
.det{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-weight:600}
.bar{height:10px;border-radius:5px;margin:4px 0}.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.res .line{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}.notice{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:12px}
.err{color:var(--bad)}.maplibregl-popup-content{font:12.5px/1.45 system-ui,sans-serif;max-width:380px;color:#1d2b24}.maplibregl-popup-content table td,.maplibregl-popup-content table th{border-color:#dfe6e1}
@media(max-width:820px){body{flex-direction:column}#side{width:100%;max-width:none;height:48%;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div id="side"><p class="mute">Đang tải...</p></div>
<div id="map"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
async function api(u) { const r = await fetch(u), j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : "Lỗi " + r.status); return j; }
let CFG, map, key = "", crop = "ca_phe_voi", sel = new Set(), open = new Set(), on = {}, RES = null, busy = "", err = "", lbusy = new Set();
const ready = () => map.isStyleLoaded() ? Promise.resolve() : new Promise(r => map.once("load", r));

async function overlay(id, png, b, op) {
  await ready();
  if (map.getLayer(id)) map.removeLayer(id);
  if (map.getSource(id)) map.removeSource(id);
  const [w, s, e, n] = b;
  map.addSource(id, {type: "image", url: png, coordinates: [[w, n], [e, n], [e, s], [w, s]]});
  map.addLayer({id, type: "raster", source: id, paint: {"raster-opacity": op, "raster-fade-duration": 0, "raster-resampling": "nearest"}});
  if (map.getLayer("suit") && id !== "suit") map.moveLayer("suit");
}
function drop(id) { if (map.getLayer(id)) map.removeLayer(id); if (map.getSource(id)) map.removeSource(id); }

function legend(l) {
  if (!l) return "";
  if (l.type === "numeric") return `<div class="bar" style="background:linear-gradient(90deg,${l.stops.join(",")})"></div><div class="row" style="justify-content:space-between"><span>${l.min.toFixed(1)}</span><span>${l.max.toFixed(1)}</span></div>`;
  if (l.type === "category") return l.items.map(i => `<div><span class="sw" style="background:${i.color}"></span>${esc(i.label)}</div>`).join("");
  if (l.cls) return l.cls.map(c => `<div><span class="sw" style="background:${c.color}"></span>${esc(c.name)}</div>`).join("") + `<p class="mute">${esc(l.note || "")}</p>`;
  return "";
}
function groups(c) {
  const rows = c.groups.map(g => { const s = g.scores[crop]; return `<tr><td>${esc(g.label)}</td><td>${s ? s.score + " (" + esc(s.level || "") + ")" : "không áp dụng"}</td><td>${s && s.status === "nhap" ? '<span class="tag w">nháp</span>' : ""}</td></tr>`; }).join("");
  return rows ? `<table><tr><th>Nhóm giá trị</th><th>Điểm</th><th></th></tr>${rows}</table>` : `<p class="mute">Chưa có bảng điểm cho tiêu chí này.</p>`;
}
function crit(c) {
  const ok = c.has_data && c.has_table, tags = (!c.has_table ? '<span class="tag w">chờ bảng điểm</span> ' : "") + (!c.has_data ? '<span class="tag w">chưa có dữ liệu</span> ' : "");
  const lay = on[c.id], isOpen = open.has(c.id);
  return `<div class="crit ${ok ? "" : "off"}"><label><input type="checkbox" data-sel="${c.id}" ${sel.has(c.id) ? "checked" : ""} ${ok ? "" : "disabled"}><span>${esc(c.name)} ${c.unit ? '<span class="mute">(' + esc(c.unit) + ")</span>" : ""}<br>${tags}</span></label>
  <div class="row" style="margin-top:6px"><button data-lay="${c.id}" ${c.has_data && !lbusy.has(c.id) ? "" : "disabled"}>${lbusy.has(c.id) ? "Đang tạo lớp…" : lay ? "Ẩn lớp" : "Hiện lớp"}</button><button data-det="${c.id}">${isOpen ? "Ẩn mục lục" : "Mục lục"}</button></div>
  ${isOpen ? `<div class="det">${lay ? legend(lay.legend) + (lay.info ? `<p class="mute">${esc(lay.info)}</p>` : "") : ""}<p class="mute"><b>Thang điểm của ${esc(CFG.cay[crop])}</b></p>${groups(c)}${c.note ? `<p class="mute">${esc(c.note)}</p>` : ""}</div>` : ""}</div>`;
}
function result() {
  if (!RES) return "";
  const L = RES.legend, tot = RES.area_km2.reduce((a, b) => a + b, 0);
  return `<h2>Kết quả: ${esc(CFG.cay[RES.crop])}</h2><div class="res">${L.map((p, i) => `<div class="line"><span><span class="sw" style="background:${p.mau}"></span>${p.ma} - ${esc(p.ten)}</span><span>${(RES.frac[i] * 100).toFixed(1)}% · ${Math.round(RES.area_km2[i]).toLocaleString("vi-VN")} km²</span></div>`).join("")}</div>
  <p class="mute">Điểm trung bình Si: ${RES.mean_si == null ? "-" : RES.mean_si.toFixed(2)} · Tổng diện tích đánh giá ${Math.round(tot).toLocaleString("vi-VN")} km²</p>
  ${RES.weights_status === "tam" ? '<div class="notice">Chưa có ma trận AHP nên các tiêu chí đang có trọng số bằng nhau (tạm).</div>' : ""}
  ${RES.draft.length ? `<div class="notice">Có điểm nháp, chưa chuyên gia xác nhận, ở: ${RES.draft.map(i => esc(CFG.tieu_chi.find(c => c.id === i).name)).join(", ")}.</div>` : ""}
  <h2>Tiêu chí đã dùng</h2>${RES.used.map(u => `<div class="line" style="display:flex;justify-content:space-between"><span>${esc(u.name)}</span><span>${(u.w * 100).toFixed(1)}%</span></div>`).join("")}
  ${RES.missing_layers.length ? `<p class="mute">Chưa tính vì thiếu dữ liệu: ${RES.missing_layers.map(m => esc(m.name)).join(", ")}</p>` : ""}
  ${RES.no_table.length ? `<p class="mute">Chưa tính vì chưa có bảng điểm: ${RES.no_table.map(m => esc(m.name)).join(", ")}</p>` : ""}
  <p class="mute">Bấm vào một điểm trên bản đồ để xem từng tiêu chí đóng góp bao nhiêu.</p>`;
}
function view() {
  const list = CFG.tieu_chi.filter(c => c.crops.includes(crop) || !c.has_table);
  $("side").innerHTML = `<h1>Bản đồ thích nghi đất đai</h1><p class="mute">${esc(CFG.phuong_phap)}</p>
  <h2>Cây trồng</h2><select id="crop">${Object.entries(CFG.cay).map(([k, v]) => `<option value="${k}" ${k === crop ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>
  <h2>Tiêu chí (chọn để tính)</h2><div class="row"><button data-all="1">Chọn hết</button><button data-all="0">Bỏ chọn</button></div>${list.map(crit).join("")}
  <div style="margin-top:12px"><button class="g" id="go" ${busy ? "disabled" : ""}>${busy || "Tính bản đồ thích hợp"}</button>${err ? `<p class="err">${esc(err)}</p>` : ""}</div>${result()}`;
}
function usable() { return CFG.tieu_chi.filter(c => c.has_data && c.has_table && c.crops.includes(crop)).map(c => c.id); }

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-sel],[data-lay],[data-det],[data-all],#go"); if (!t) return; const d = t.dataset;
  try {
    if (d.sel) { t.checked ? sel.add(d.sel) : sel.delete(d.sel); return; }
    if (d.all !== undefined) { sel = new Set(d.all === "1" ? usable() : []); view(); return; }
    if (d.det) { open.has(d.det) ? open.delete(d.det) : open.add(d.det); if (open.has(d.det) && !on[d.det] && CFG.tieu_chi.find(c => c.id === d.det).has_data) { /* mục lục hiện chú giải khi bật lớp */ } view(); return; }
    if (d.lay) {
      if (on[d.lay]) { drop("lay_" + d.lay); delete on[d.lay]; }
      else {
        lbusy.add(d.lay); view();   // báo "Đang tạo lớp…" ngay: lần đầu máy chủ phải vẽ lớp, các lần sau lấy từ bản đã lưu
        try { const m = await api(`/api/land/layer?id=${d.lay}&crop=${crop}`); await overlay("lay_" + d.lay, m.png, m.bounds, .8); on[d.lay] = m; open.add(d.lay); }
        finally { lbusy.delete(d.lay); }
      }
      view(); return;
    }
    if (t.id === "go") {
      if (!sel.size) { err = "Hãy chọn ít nhất một tiêu chí."; view(); return; }
      busy = "Đang tính..."; err = ""; view();
      RES = await api(`/api/land/suitability?crop=${crop}&criteria=${[...sel].join(",")}`);
      await overlay("suit", RES.png, RES.bounds, .85);
    }
  } catch (x) { err = x.message; }
  busy = ""; view();
});
document.addEventListener("change", e => {
  if (e.target.id === "crop") { crop = e.target.value; sel = new Set(usable()); RES = null; drop("suit"); for (const k of Object.keys(on)) { drop("lay_" + k); delete on[k]; } view(); }
});
async function onClick(e) {
  if (!RES) return;
  try {
    const p = await api(`/api/land/point?crop=${crop}&lng=${e.lngLat.lng}&lat=${e.lngLat.lat}&criteria=${RES.used.map(u => u.id).join(",")}`);
    const rows = p.rows.map(r => `<tr><td>${esc(r.name)}</td><td>${r.value == null ? "-" : r.value + " " + esc(r.unit || "")}</td><td>${esc(r.group || "-")}</td><td>${r.score ?? "-"}</td><td>${(r.w * 100).toFixed(0)}%</td></tr>`).join("");
    new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<b>Si = ${p.si ?? "-"}</b>${p.hang ? " · " + esc(p.hang.ma) + " " + esc(p.hang.ten) : ""}<table><tr><th>Tiêu chí</th><th>Giá trị</th><th>Nhóm</th><th>Điểm</th><th>Wi</th></tr>${rows}</table>`).addTo(map);
  } catch (x) { new maplibregl.Popup().setLngLat(e.lngLat).setHTML(esc(x.message)).addTo(map); }
}
(async () => {
  try {
    const c = await api("/api/config"); CFG = await api("/api/land/config");
    map = new maplibregl.Map({container: "map", style: `https://api.maptiler.com/maps/hybrid/style.json?key=${c.maptilerKey}`, center: [107.6, 12.9], zoom: 7});
    map.addControl(new maplibregl.NavigationControl(), "top-right"); map.on("click", onClick);
    sel = new Set(usable()); view();
  } catch (x) { $("side").innerHTML = `<p class="err">${esc(x.message)}</p><p class="mute">Nếu chưa đăng nhập, hãy đăng nhập ở trang chính rồi quay lại.</p>`; }
})();
</script>
</body>
</html>
